<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · RESERVED LA</title>
<meta name="description" content="Secure checkout — Reserved LA. Encrypted. All prices in USD.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png?v=134">
  <link rel="apple-touch-icon" href="assets/favicon.png?v=134">
<link rel="stylesheet" href="styles.css?v=134">
</head>
<body>
<div id="announce-slot"></div>
<div id="header-slot"></div>

<main>
  <div class="crumbs wrap"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / Checkout</div>
  <div class="wrap">
    <h1 class="display" style="font-size:clamp(34px,6vw,56px);margin:4px 0 6px">Checkout</h1>
    <div id="coRoot"></div>
  </div>
</main>

<div id="footer-slot"></div>
<script src="js/data.js?v=134"></script>
<script src="js/site.js?v=134"></script>
<script>
mountChrome("");

(function(){
  const root = document.getElementById("coRoot");
  const cart = getCart();
  let discount = 0, promoCode = "";
  const PROMOS = { "RESERVED10": 0.10, "FW26": 0.15 }; // demo discount codes

  if(!cart.length){
    root.innerHTML = `<div class="co-empty">
      <p style="font-family:var(--font-display);font-size:26px;text-transform:uppercase;color:var(--ink)">Your bag is empty</p>
      <p>Add something worth reserving before checking out.</p>
      <p style="margin-top:20px"><a class="btn" href="shop.html">Shop The Collection</a></p></div>`;
    return;
  }

  function totals(){
    const sub = cartSubtotal();
    const disc = +(sub * discount).toFixed(2);
    const afterDisc = sub - disc;
    const ship = afterDisc >= BRAND.freeShipThreshold || afterDisc === 0 ? 0 : 6.95;
    const total = afterDisc + ship;
    return {sub, disc, ship, total};
  }

  function render(){
    const t = totals();
    const items = getCart().map(l=>`
      <div class="sum-line">
        <div class="sum-thumb"><img class="th" src="${l.img}" alt="${l.name}"><span class="qbadge">${l.qty}</span></div>
        <div class="sl-info">
          <div class="sl-name">${l.name}</div>
          <div class="sl-meta">${l.cat} · Size ${l.size}</div>
        </div>
        <div class="sl-price">${fmt(l.price*l.qty)}</div>
      </div>`).join("");

    root.innerHTML = `
    <form class="checkout-grid" id="coForm" novalidate>
      <div class="co-main">
        <div class="co-badge">${ICON.lock} Secure, encrypted checkout · all prices in USD</div>

        <div class="co-section">
          <h2>Contact</h2>
          <div class="co-row">
            <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
            <div class="field"><label>Phone <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(for order updates)</span></label><input type="tel" name="phone" required placeholder="(555) 123-4567"></div>
          </div>
          <label class="co-check"><input type="checkbox" name="smsOptin"> <span>I would like to receive updates by text</span></label>
          <p class="co-fine">We'll send order updates and occasional offers from Reserved LA. Message &amp; data rates may apply. Message frequency varies. Reply HELP for help or STOP to opt out. See our <a href="sms-terms.html">SMS Terms &amp; Privacy</a>.</p>
        </div>

        <div class="co-section">
          <h2>Shipping Address</h2>
          <div class="co-row"><div class="field"><label>Full name</label><input type="text" name="name" required placeholder="Jane Doe"></div></div>
          <div class="co-row" style="margin-top:14px"><div class="field"><label>Address</label><input type="text" name="address" required placeholder="123 Main St"></div></div>
          <div class="co-row" style="margin-top:14px"><div class="field"><label>Apartment, suite, etc. <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">(optional)</span></label><input type="text" name="apt" placeholder="Apt 4B"></div></div>
          <div class="co-row three" style="margin-top:14px">
            <div class="field"><label>City</label><input type="text" name="city" required placeholder="Los Angeles"></div>
            <div class="field"><label>State</label><input type="text" name="state" required placeholder="CA"></div>
            <div class="field"><label>ZIP</label><input type="text" name="zip" required placeholder="90001"></div>
          </div>
          <div class="co-row" style="margin-top:14px"><div class="field"><label>Country</label>
            <select name="country"><option>United States</option></select></div></div>
        </div>

        <div class="co-section">
          <h2>Payment</h2>
          <div class="co-badge">${ICON.lock} Card details are encrypted by NMI — we never see your full card number.</div>
          <span class="cc-logos co-cards" aria-label="We accept Visa, Mastercard, American Express and Discover">
            <img src="assets/cards/visa.svg" alt="Visa" loading="lazy">
            <img src="assets/cards/mastercard.svg" alt="Mastercard" loading="lazy">
            <img src="assets/cards/amex.svg" alt="American Express" loading="lazy">
            <img src="assets/cards/discover.svg" alt="Discover" loading="lazy">
          </span>

          <!-- Demo card fields (visual only — shown when the NMI backend isn't live, e.g. the GitHub Pages preview) -->
          <div id="demoCardFields">
            <div class="field"><label>Card number</label><input id="cardNum" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456"></div>
            <div class="co-row two">
              <div class="field"><label>Expiry (MM/YY)</label><input id="cardExp" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY"></div>
              <div class="field"><label>CVC</label><input id="cardCvc" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC"></div>
            </div>
          </div>

          <!-- NMI Collect.js secure fields (hosted by NMI, PCI-safe) — shown on reservedla.com -->
          <div id="nmiCardFields" style="display:none">
            <div class="field"><label>Card number</label><div id="nmi-ccnumber" class="nmi-field"></div></div>
            <div class="co-row two">
              <div class="field"><label>Expiry (MM/YY)</label><div id="nmi-ccexp" class="nmi-field"></div></div>
              <div class="field"><label>CVC</label><div id="nmi-cvv" class="nmi-field"></div></div>
            </div>
          </div>
          <div class="sq-status" id="payStatus"></div>
        </div>

        <div class="co-section">
          <h2>Billing Address</h2>
          <label class="co-check"><input type="checkbox" name="sameAsShip" checked onchange="toggleBilling(this)"> <span>Same as shipping address</span></label>
          <div id="billingFields" hidden>
            <div class="co-row" style="margin-top:6px"><div class="field"><label>Full name</label><input type="text" name="bname" placeholder="Jane Doe"></div></div>
            <div class="co-row" style="margin-top:14px"><div class="field"><label>Address</label><input type="text" name="baddress" placeholder="123 Main St"></div></div>
            <div class="co-row three" style="margin-top:14px">
              <div class="field"><label>City</label><input type="text" name="bcity" placeholder="Los Angeles"></div>
              <div class="field"><label>State</label><input type="text" name="bstate" placeholder="CA"></div>
              <div class="field"><label>ZIP</label><input type="text" name="bzip" placeholder="90001"></div>
            </div>
          </div>
        </div>
      </div>

      <aside class="summary">
        <h2>Order Summary</h2>
        <div class="sum-items">${items}</div>
        <div class="promo">
          <input type="text" id="promoInput" placeholder="Discount code" value="${promoCode}">
          <button type="button" class="btn ghost" onclick="applyPromo()">Apply</button>
        </div>
        <div class="sum-rows">
          <div class="sum-row"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
          ${t.disc>0?`<div class="sum-row disc"><span>Discount (${promoCode})</span><span>−${fmt(t.disc)}</span></div>`:""}
          <div class="sum-row"><span>Shipping</span><span>${t.ship===0?"FREE":fmt(t.ship)}</span></div>
          <div class="sum-row total"><span>Total</span><span>${fmt(t.total)}</span></div>
        </div>
        <div class="billed-note">${ICON.lock}<span>Billed as <b>ZA DISTRIBUTION LLC</b> on your statement.</span></div>
        <label class="co-check"><input type="checkbox" name="agree" id="agree" onchange="document.getElementById('payBtn').disabled=!this.checked"> <span>I agree to the <a href="terms.html">Terms &amp; Conditions</a>, <a href="refund-policy.html">Refund Policy</a>, and <a href="privacy-policy.html">Privacy Policy</a>.</span></label>
        <button type="submit" class="btn block pay-btn" id="payBtn" disabled>${ICON.lock} Pay ${fmt(t.total)}</button>
        <div class="pay-hint" id="payHint"></div>
        <div class="secure-line">${ICON.lock} Secure Checkout · 256-bit encryption</div>
        <div class="co-pays"><span class="pb">VISA</span><span class="pb">MASTERCARD</span><span class="pb">AMEX</span><span class="pb">DISCOVER</span><span class="pb">APPLE&nbsp;PAY</span></div>
        <div style="text-align:center"><a class="co-back" href="shop.html">← Continue shopping</a></div>
      </aside>
    </form>`;

    document.getElementById("coForm").addEventListener("submit", onPay);
    attachNMI();
  }

  // ---------- NMI Collect.js ----------
  const baseUrl = () => location.pathname.replace(/[^/]*$/, "");
  let nmiCfg=null, nmiReady=false, nmiInit=false;
  let paymentMode="demo";   // "demo" | "real" — auto-detected from the server

  // Ask the server whether real NMI is configured. No PHP (preview host) or keys
  // off -> stay in demo mode (no real charge). Runs once.
  async function attachNMI(){
    if(nmiInit) return; nmiInit=true;
    try{ nmiCfg = await fetch(baseUrl()+"pay/public-config.php", {cache:"no-store"}).then(r=>r.json()); }
    catch(e){ nmiCfg=null; }
    if(nmiCfg && nmiCfg.configured){ enterRealMode(); }
    // else: demo mode — the visible demo card fields stay.
  }

  // Swap the visible demo inputs for NMI's secure fields and load Collect.js.
  function enterRealMode(){
    paymentMode="real";
    const demo=document.getElementById("demoCardFields"); if(demo) demo.style.display="none";
    const real=document.getElementById("nmiCardFields"); if(real) real.style.display="block";
    ["cardNum","cardExp","cardCvc"].forEach(idn=>{ const el=document.getElementById(idn); if(el) el.disabled=true; });
    const s=document.createElement("script");
    s.src = nmiCfg.collectJsUrl || "https://secure.nmi.com/token/Collect.js";
    s.setAttribute("data-tokenization-key", nmiCfg.tokenizationKey);
    s.onload=()=>{
      try{
        CollectJS.configure({
          variant:"inline", styleSniffer:false,
          customCss:{ "border":"none","outline":"none","box-shadow":"none","background-color":"transparent",
            "width":"100%","height":"46px","padding":"0","margin":"0",
            "font-family":"'Inter',sans-serif","font-size":"15px","color":"#111" },
          focusCss:{ "border":"none","outline":"none","box-shadow":"none" },
          invalidCss:{ "color":"#c0392b","border":"none" },
          placeholderCss:{ "color":"#9aa1b4" },
          fields:{
            ccnumber:{ selector:"#nmi-ccnumber", placeholder:"Card Number" },
            ccexp:{ selector:"#nmi-ccexp", placeholder:"MM / YY" },
            cvv:{ selector:"#nmi-cvv", placeholder:"CVV" }
          },
          callback: nmiCallback,
          timeoutDuration: 15000,
          timeoutCallback: ()=> payFail("Card entry timed out. Please re-enter your card and try again."),
          fieldsAvailableCallback: ()=>{ nmiReady=true; },
          validationCallback:(field,ok,msg)=>{
            const map={ ccnumber:"nmi-ccnumber", ccexp:"nmi-ccexp", cvv:"nmi-cvv" };
            const el=document.getElementById(map[field]); if(!el) return;
            const emptyish = !ok && /empty|required|blank/i.test(msg||"");
            el.classList.toggle("nmi-invalid", !ok && !emptyish);
          }
        });
      }catch(e){ payFail("Payment form failed to initialise. Please refresh."); }
    };
    s.onerror=()=>{ payFail("Secure payment library failed to load. Please refresh."); };
    document.head.appendChild(s);
  }

  let payBtnLabel="";
  function setProcessing(on){
    const btn=document.getElementById("payBtn"); if(!btn) return;
    if(on && !payBtnLabel) payBtnLabel=btn.innerHTML;
    btn.disabled=on;
    btn.innerHTML = on ? "Processing…" : (payBtnLabel || btn.innerHTML);
    const hint=document.getElementById("payHint");
    if(hint) hint.textContent = on ? "Securely processing your payment — please don’t close this window." : "";
  }
  function payFail(msg){
    setProcessing(false);
    const btn=document.getElementById("payBtn"); if(btn) btn.disabled=false;
    const hint=document.getElementById("payHint"); if(hint) hint.textContent = msg || "Payment failed. Please try again.";
  }

  // Collect.js calls this once the card is tokenized (real mode only).
  function nmiCallback(resp){
    if(!resp || !resp.token){ payFail("We couldn’t read your card. Please re-enter your details."); return; }
    const f=document.getElementById("coForm");
    const g=n=>{ const el=f&&f.querySelector('[name='+n+']'); return el?(el.value||"").trim():""; };
    const sp=(g("name")||"").split(/\s+/);
    const items=getCart().map(l=>({id:l.id, qty:l.qty}));
    const payload={
      token:resp.token, items, promo:promoCode,
      email:g("email"), phone:g("phone"),
      firstName:sp.shift()||"", lastName:sp.join(" "),
      address:g("address"), city:g("city"), state:g("state"), zip:g("zip")
    };
    fetch(baseUrl()+"pay/process-payment.php",{
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).then(r=>r.json()).then(res=>{
      if(res && res.ok){ confirmOrder(res); }
      else if(res && res.key_error){ confirmOrder({}); } // keys off on server -> demo confirmation
      else { payFail((res&&res.error)||"Your payment was declined. Please try another card."); }
    }).catch(()=> payFail("Network error while processing payment. Please try again."));
  }

  async function onPay(e){
    e.preventDefault();
    const f=e.target;
    if(!f.checkValidity()){ f.reportValidity(); return; }
    if(!document.getElementById("agree").checked){
      document.getElementById("payHint").textContent="Please check the box above to complete your order."; return;
    }
    setProcessing(true);
    if(paymentMode==="real"){
      if(!nmiReady || typeof CollectJS==="undefined"){ payFail("Payment form is still loading — please try again in a moment."); return; }
      try{ CollectJS.startPaymentRequest(); }
      catch(err){ payFail("Could not start secure payment. Please refresh and try again."); }
    }else{
      // DEMO: simulate processing -> confirmation (no real charge)
      setTimeout(()=> confirmOrder({}), 1400);
    }
  }

  // Repaint only the summary numbers (used by promo apply) so the live NMI card
  // fields are never torn down and rebuilt.
  function paintSummary(){
    const t=totals();
    const rows=document.querySelector(".sum-rows");
    if(rows) rows.innerHTML = `
          <div class="sum-row"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
          ${t.disc>0?`<div class="sum-row disc"><span>Discount (${promoCode})</span><span>−${fmt(t.disc)}</span></div>`:""}
          <div class="sum-row"><span>Shipping</span><span>${t.ship===0?"FREE":fmt(t.ship)}</span></div>
          <div class="sum-row total"><span>Total</span><span>${fmt(t.total)}</span></div>`;
    const btn=document.getElementById("payBtn");
    if(btn && !btn.disabled){ btn.innerHTML = `${ICON.lock} Pay ${fmt(t.total)}`; payBtnLabel=btn.innerHTML; }
  }

  window.toggleBilling = function(cb){ document.getElementById("billingFields").hidden = cb.checked; };

  window.applyPromo = function(){
    const code = (document.getElementById("promoInput").value||"").trim().toUpperCase();
    if(!code){ return; }
    if(PROMOS[code]){ discount = PROMOS[code]; promoCode = code; toast("Promo applied — "+(discount*100)+"% off"); }
    else { discount = 0; promoCode=""; toast("That code isn't valid."); }
    paintSummary();
  };

  function confirmOrder(pay){
    const order = "RL-" + Math.floor(100000 + Math.random()*900000);
    const f = document.getElementById("coForm");
    const g = n => { const el = f && f.querySelector('[name='+n+']'); return el ? (el.value||"").trim() : ""; };
    const email = g("email") || "your email";

    // Send the Order Confirmation email (the one we set up via mail/place-order.php).
    // Best-effort — the UI never blocks on it.
    try {
      const t = totals();
      const abs = u => { try { return new URL(u, location.href).href; } catch(e){ return u; } };
      const last4 = (pay && pay.card_last4) ? pay.card_last4 : "";
      const items = getCart().map(l => {
        const p = (typeof PRODUCTS !== "undefined") ? PRODUCTS.find(x => x.id === l.id) : null;
        return { name:l.name, color:(p&&p.color)||"", size:l.size, quantity:l.qty,
                 line_total: fmt(l.price*l.qty), image_url: abs(l.img) };
      });
      const dfmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      const payload = {
        customer_email: g("email"),
        customer_phone: g("phone"),
        customer_first_name: (g("name").split(/\s+/)[0] || ""),
        order_number: order,
        order_date: dfmt(new Date()),
        payment_method: last4 ? ("Card ending " + last4) : "Card",
        estimated_delivery: dfmt(new Date(Date.now() + 7*864e5)),
        subtotal: fmt(t.sub),
        shipping: t.ship === 0 ? "Free" : fmt(t.ship),
        tax: "$0.00",
        total: fmt(t.total),
        shipping_name: g("name"),
        shipping_address_line1: g("address") + (g("apt") ? (", " + g("apt")) : ""),
        shipping_city: g("city"), shipping_state: g("state"), shipping_zip: g("zip"),
        shipping_method: "Standard US",
        order_url: abs("track-order.html"),
        items: items
      };
      fetch(baseUrl() + "mail/place-order.php", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      }).then(r => r.json()).then(d => { if (!d.ok) console.warn("Order confirmation not sent:", d.error); })
        .catch(err => console.warn("Order confirmation request failed:", err));
    } catch(e) { console.warn("Order confirmation skipped:", e); }

    try{ localStorage.removeItem("rl_cart_v1"); }catch(e){}
    updateCartCount(); if(typeof renderCart==="function") renderCart();
    root.innerHTML = `
    <div class="co-confirm">
      <div class="tick">${ICON.check}</div>
      <h1>Thank You</h1>
      <p class="ord">Your order <b>#${order}</b> has been placed.</p>
      <p class="ord">Your payment was successful and your order confirmation has been emailed to <b>${email}</b>. You'll get tracking as soon as it ships (1–2 business days).</p>
      <p style="margin:24px 0 6px"><a class="btn" href="shop.html">Continue Shopping</a></p>
      <p class="co-fine" style="max-width:440px;margin:14px auto 0">Questions about your order? Email <a href="mailto:support@reservedla.com">support@reservedla.com</a>.</p>
    </div>`;
    window.scrollTo({top:0,behavior:"smooth"});
  }

  render();
})();
</script>
</body>
</html>
